<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="210" y1="80" x2="860" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8F4FF" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#B99BFF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#FFC6D9" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="screen" x1="445" y1="180" x2="790" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B55"/>
      <stop offset=".55" stop-color="#172A79"/>
      <stop offset="1" stop-color="#3921A0"/>
    </linearGradient>
    <linearGradient id="screenShine" x1="470" y1="190" x2="760" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C8CFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A34BFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="laptopBase" x1="390" y1="470" x2="835" y2="555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8796C9"/>
      <stop offset=".25" stop-color="#F8FAFF"/>
      <stop offset=".62" stop-color="#B8C4E9"/>
      <stop offset="1" stop-color="#6576B2"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6B4BFF"/><stop offset="1" stop-color="#B43DEB"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43D9F4"/><stop offset="1" stop-color="#587BFF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB4D8"/><stop offset="1" stop-color="#A88BFF"/>
    </linearGradient>
    <linearGradient id="phone" x1="760" y1="250" x2="860" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202B5E"/><stop offset="1" stop-color="#080E2E"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-40%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><path d="M458 177Q459 166 471 165L774 145Q788 144 787 158L768 434Q767 447 754 448L438 435Z"/></clipPath>
    <clipPath id="phoneClip"><rect x="773" y="239" width="101" height="262" rx="19"/></clipPath>
  </defs>

  <!-- smartphone -->
  <g filter="url(#shadow)" transform="rotate(5 824 370)">
    <rect x="768" y="235" width="112" height="272" rx="22" fill="url(#phone)" stroke="#A9B8EA" stroke-width="3"/>
    <rect x="776" y="247" width="96" height="247" rx="15" fill="#F8FAFF"/>
    <rect x="808" y="241" width="32" height="5" rx="2.5" fill="#6674A8"/>
    <g clip-path="url(#phoneClip)">
      <rect x="780" y="253" width="90" height="236" fill="#FBFCFF"/>
      <text x="789" y="272" font-family="Arial, sans-serif" font-size="7" fill="#53628E" font-weight="700">Dashboard</text>
      <circle cx="850" cy="269" r="5" fill="#E8E6FF"/>
      <rect x="786" y="283" width="80" height="56" rx="8" fill="#F1F0FF"/>
      <text x="794" y="297" font-family="Arial, sans-serif" font-size="6" fill="#7D83A6">Monthly growth</text>
      <path d="M794 326L804 317L815 320L827 307L838 312L854 299" stroke="#7B55F4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M794 326L804 317L815 320L827 307L838 312L854 299L854 331L794 331Z" fill="#A58AFF" opacity=".13"/>
      <rect x="786" y="348" width="80" height="59" rx="8" fill="#FFFFFF" stroke="#ECEBFA"/>
      <circle cx="805" cy="371" r="11" fill="#EDE9FF"/>
      <path d="M800 371L804 375L811 366" stroke="#7653EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="821" y="362" width="35" height="5" rx="2.5" fill="#AAB2D0"/>
      <rect x="821" y="372" width="27" height="4" rx="2" fill="#D5D9EA"/>
      <rect x="786" y="416" width="80" height="59" rx="8" fill="#FFFFFF" stroke="#ECEBFA"/>
      <circle cx="826" cy="445" r="17" fill="#F0EDFF"/>
      <path d="M826 428A17 17 0 0 1 842 450L826 445Z" fill="#7957F2"/>
      <path d="M826 445L826 428A17 17 0 0 0 811 451Z" fill="#4CCBEA"/>
      <rect x="795" y="468" width="61" height="3" rx="1.5" fill="#E3E5F0"/>
    </g>
  </g>

</svg>
